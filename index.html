<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Thảo...</title>
    <style>
        :root {
            --primary-color: #ff758c;
            --secondary-color: #ff7eb3;
            --bg-color: #ffeef2;
            --text-color: #4a4a4a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, var(--bg-color) 0%, #feccd7 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Hiệu ứng tim rơi */
        .heart {
            position: absolute;
            color: rgba(255, 117, 140, 0.6);
            font-size: 20px;
            animation: fall linear infinite;
            z-index: 0;
        }

        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        /* Phong bì thư */
        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.5s;
        }

        .envelope-wrapper:hover {
            transform: scale(1.05);
        }

        .envelope {
            position: relative;
            width: 300px;
            height: 200px;
            background: #f9d5e5;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 150px 100px 150px;
            border-color: transparent transparent #f5b3cd transparent;
            z-index: 3;
        }

        .envelope-top {
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 100px 150px 0 150px;
            border-color: #ff9ebb transparent transparent transparent;
            transform-origin: top;
            transition: transform 0.4s ease;
            z-index: 4;
        }

        .envelope-wrapper.open .envelope-top {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .heart-seal {
            position: absolute;
            top: 85px;
            left: 135px;
            font-size: 30px;
            color: #ff4757;
            z-index: 5;
            transition: transform 0.4s;
        }

        .envelope-wrapper.open .heart-seal {
            transform: scale(0);
        }

        .click-hint {
            position: absolute;
            bottom: -40px;
            width: 100%;
            text-align: center;
            color: #d63031;
            font-weight: bold;
            font-size: 14px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Nội dung bức thư */
        .letter-container {
            display: none;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            z-index: 20;
            overflow-y: auto;
            border: 2px solid #ffccd7;
        }

        .letter-title {
            color: #d63031;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 600;
            border-bottom: 1px dashed #ff758c;
            padding-bottom: 10px;
            line-height: 1.6;
        }

        .letter-content {
            color: var(--text-color);
            font-size: 16px;
            line-height: 1.8;
            white-space: pre-wrap;
            text-align: justify;
        }

        .signature {
            text-align: right;
            margin-top: 20px;
            font-style: italic;
            font-weight: bold;
            color: #ff758c;
        }
    </style>
</head>
<body>

    <!-- Giao diện phong bì ban đầu -->
    <div class="envelope-wrapper" id="envelopeWrapper" onclick="openLetter()">
        <div class="envelope-top"></div>
        <div class="envelope"></div>
        <div class="heart-seal">❤️</div>
        <div class="click-hint">Chạm vào trái tim để mở thư của Anh...</div>
    </div>

    <!-- Giao diện nội dung bức thư sau khi mở -->
    <div class="letter-container" id="letterContainer">
        <div class="letter-title" id="letterTitle"></div>
        <div class="letter-content" id="letterContent"></div>
        <div class="signature" id="letterSignature"></div>
    </div>

    <script>
        // Nội dung bức thư được phân tách
        const introductorySentence = "Những lời trong này sẽ là những lời anh chia sẻ thật lòng suốt 6 tháng qua.";
        
        const mainContent = `Gửi Thảo,

Anh có lẽ có thể viết bài này hoặc bức thư khi hai người đã dừng và đợi nói chuyện buổi tối. Anh sẽ cực kì thật lòng với chính mình và với em trong này. 

Mỗi lần quát mắng mỗi lần chửi bới này kia trong suốt 6 tháng này là anh đã làm thế là để xoa dịu chính mình vì anh lúc đó ko hề suy nghĩ đến hậu quả. Nếu như em nói là lúc đó anh ko quan tâm hi tối. Anh sẽ cực kì thật lòng với chính mình và với em. Mỗi lần quát mắng mỗi lần chửi bới này kia trong suốt 6 tháng này là anh đã làm thế là để xoa dịu chính mình vì anh lúc đó anh ko hề suy nghĩ đến hậu quả là làm em khóc hay tổn thương. 

Nếu như em nói là anh ko quan tâm đến cảm xúc của em thì anh nói luôn là em đúng một phần. Chắc em cảm thấy có mỗi anh là hay gây sự hoặc là một cái gọi là " thứ mà hay làm rạn nứt mối quan hệ này" thì anh sẽ nói em đúng. Thay vì em chỗ để em có thể vui vẻ hoặc che chở cho em thì anh luôn " vậy" nếu em hiểu.

Mỗi khi tức giận, anh đã không làm chủ được cảm xúc, để cái tôi quá lớn và những lời nói nặng nề làm tổn thương người con gái mà anh luôn tự hứa sẽ trân trọng suốt đời. Anh không muốn viện cớ cho những sai lầm của mình. Việc anh chửi lớn hay dỗi vô cớ hoàn toàn là lỗi của anh, là sự ích kỷ và thiếu chín chắn trong tình yêu. 

Anh biết em là người như nào-- vui vẻ-- hòa đồng --và luôn luôn cố gắng thay đổi vì anh , mà anh lại ko trân trọng. Cho anh xin lỗi nhé, Thảo ơi. Hãy cho anh một cơ hội cuối cùng để sửa sai. Anh hứa từ nay sẽ học cách kiềm chế, học cách lắng nghe em nhiều hơn và tuyệt đối không bao giờ dùng những lời lớn tiếng để tổn thương em nữa. Hãy cho anh thêm một cơ hội để được yêu thương, chăm sóc và bù đắp lại tất cả những tổn thương anh đã gây ra cho em, được không em?

Anh ko mong em sẽ "tha thứ" cho anh, anh chỉ mong em "hiểu" và để anh một lần nữa quay lại..`;

        const signatureText = "- Tùng -";

        // Hàm tạo hiệu ứng trái tim rơi
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            heart.style.fontSize = Math.random() * 15 + 15 + 'px';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
        setInterval(createHeart, 300);

        // Hàm chạy chữ (Typewriter effect)
        function typeWriter(text, elementId, speed, callback) {
            let i = 0;
            const element = document.getElementById(elementId);
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else if (callback) {
                    callback();
                }
            }
            type();
        }

        // Hàm kích hoạt khi bấm mở thư
        function openLetter() {
            const wrapper = document.getElementById('envelopeWrapper');
            wrapper.classList.add('open');
            
            setTimeout(() => {
                wrapper.style.display = 'none';
                const container = document.getElementById('letterContainer');
                container.style.display = 'block';
                
                // Bắt đầu chạy chữ câu đầu tiên, sau đó tới thân bài, cuối cùng là chữ ký
                typeWriter(introductorySentence, 'letterTitle', 50, () => {
                    typeWriter(mainContent, 'letterContent', 30, () => {
                        typeWriter(signatureText, 'letterSignature', 100);
                    });
                });
            }, 1000);
        }
    </script>
</body>
</html>
